<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>说清楚，再开工 · 客户需求 → 自动软件工厂（可点原型）</title>
<style>
:root{
  --bg:#f4f1e9;
  --bg-2:#ece7db;
  --paper:#fbf8f1;
  --paper-2:#fffdf8;
  --ink:#211e18;
  --ink-2:#4b453a;
  --muted:#736b5d;
  --faint:#a49b8a;
  --line:#e1dacb;
  --line-2:#cec5b3;
  --accent:#38479b;
  --accent-2:#2b3878;
  --tint:#eceefa;
  --tint-2:#dfe2f4;
  --accent-line:#c3c9e7;
  --green:#2f6b4d;
  --green-2:#24543c;
  --green-tint:#eaf2ec;
  --green-line:#c3d8ca;
  --amber:#8a5a12;
  --amber-tint:#f8f0df;
  --amber-line:#e4d3b0;
  --red:#9a3a2c;
  --red-tint:#f9ece8;
  --red-line:#e9c9c1;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  --r:10px;
  --r-sm:6px;
  --shadow-float:0 18px 44px -28px rgba(33,30,24,.5),0 1px 2px rgba(33,30,24,.06);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--tint-2);color:var(--accent-2)}
button{font-family:inherit;color:inherit}
button,input,textarea{font-size:inherit}
a{color:var(--accent-2)}
h1,h2,h3,h4,h5,p,ol,ul{margin:0}
ul,ol{padding:0}
svg{display:block;flex:none}
code,.mono{font-family:var(--mono)}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

#app{max-width:1280px;margin:0 auto;padding:0 32px 116px}
.eyebrow{
  font-size:10.5px;letter-spacing:.16em;color:var(--muted);
  display:flex;align-items:center;gap:8px;text-transform:uppercase;
}
.serif{font-family:var(--serif);font-weight:600;letter-spacing:.01em}

/* ---------- top ---------- */
.top{
  border-top:2px solid var(--ink);
  display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
  padding:18px 0 16px;border-bottom:1px solid var(--line-2);margin-bottom:24px;
}
.brand{display:flex;gap:13px;align-items:flex-start;min-width:0}
.mark{
  width:36px;height:36px;border:1px solid var(--line-2);border-radius:8px;
  display:grid;place-items:center;color:var(--ink);background:var(--paper);flex:none;margin-top:2px;
}
.title h1{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15;letter-spacing:.02em}
.title p{margin-top:4px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proto{
  font-size:9px;letter-spacing:.14em;color:var(--accent-2);
  border:1px solid var(--accent-line);background:var(--tint);border-radius:3px;padding:1px 5px;
}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex:none}
.top-row{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;font-size:12px;padding:5px 11px;border-radius:6px;color:var(--muted);cursor:pointer;line-height:1.4}
.seg button.on{background:var(--ink);color:var(--paper-2)}
.seg button:hover:not(.on){color:var(--ink)}
.stages{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.stg{
  display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  font-size:11.5px;color:var(--muted);padding:4px 7px;border-radius:6px;cursor:pointer;line-height:1.4;
}
.stg .n{font-size:9.5px;color:var(--faint);letter-spacing:.04em}
.stg:hover{background:var(--bg-2);color:var(--ink)}
.stg.on{color:var(--accent-2);background:var(--tint);border-color:var(--accent-line)}
.stg.on .n{color:var(--accent)}
.stg.done .n{color:var(--green)}
.path{font-size:11px;color:var(--faint)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink);
  border-radius:8px;padding:8px 13px;font-size:12.5px;cursor:pointer;
  transition:background .14s ease,border-color .14s ease,color .14s ease,transform .08s ease;
  text-align:center;
}
.btn:hover{background:var(--bg-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent-2);color:#fff}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn-ghost:hover{background:var(--bg-2);color:var(--ink)}
.btn-sm{padding:5px 9px;font-size:11.5px;border-radius:6px}
.btn-wide{width:100%;padding:10px 14px;margin-top:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{
  border:0;background:transparent;padding:0;color:var(--muted);font-size:11px;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line-2);
}
.lnk:hover{color:var(--accent-2);text-decoration-color:var(--accent-line)}

/* ---------- customer layout ---------- */
.customer{display:grid;grid-template-columns:380px minmax(0,1fr);gap:32px;align-items:start}
.talk{
  position:sticky;top:16px;height:calc(100vh - 132px);min-height:520px;
  display:flex;flex-direction:column;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.talk-head{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--paper-2);
}
.talk-head b{font-size:12px;font-weight:600}
.talk-head .live{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.talk-head .meta{margin-left:auto;font-size:10.5px;color:var(--faint)}
.talk-scroll{flex:1;overflow-y:auto;padding:18px 18px 104px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.talk-scroll::-webkit-scrollbar{width:8px}
.talk-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;border:2px solid var(--paper)}

.opening{padding-top:2px}
.display{font-family:var(--serif);font-size:27px;line-height:1.3;letter-spacing:.01em;font-weight:600;margin-bottom:8px}
.lede{font-size:12.5px;color:var(--muted);line-height:1.6}
.composer{border:1px solid var(--line-2);border-radius:10px;background:var(--paper-2);margin-top:14px;transition:border-color .14s ease}
.composer:focus-within{border-color:var(--accent-line)}
.composer textarea{
  display:block;width:100%;border:0;background:transparent;resize:vertical;
  min-height:82px;max-height:180px;padding:11px 12px 6px;outline:none;color:var(--ink);
  font-family:inherit;font-size:13.5px;line-height:1.6;
}
.composer textarea::placeholder{color:var(--faint)}
.composer-foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 8px 8px 12px;border-top:1px solid var(--line);
}
.helper{font-size:10.5px;color:var(--faint);line-height:1.4}
.samples{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sample{
  text-align:left;border:1px dashed var(--line-2);background:transparent;border-radius:7px;
  padding:8px 10px;font-size:11.5px;line-height:1.5;color:var(--ink-2);cursor:pointer;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.sample:hover{border-color:var(--accent-line);background:var(--tint);color:var(--accent-2)}
.sample .q{color:var(--faint);margin-right:4px}
.industries{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;align-items:center}
.industries .lab{font-size:10px;color:var(--faint);margin-right:2px}
.chip{
  border:1px solid var(--line-2);background:var(--paper-2);border-radius:999px;
  padding:3px 8px;font-size:10.5px;color:var(--ink-2);cursor:pointer;line-height:1.5;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.chip:hover{border-color:var(--accent-line);background:var(--tint);color:var(--accent-2)}
.chip.on{background:var(--accent);border-color:var(--accent-2);color:#fff}

.said{border-left:2px solid var(--line-2);padding:1px 0 1px 10px;margin:0 0 12px;font-size:12.5px;color:var(--ink-2)}
.said .lab{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.08em;margin-bottom:2px}
.say{display:flex;gap:8px;align-items:flex-start;margin:12px 0}
.say .who{
  flex:none;font-size:9.5px;color:var(--accent-2);background:var(--tint);
  border:1px solid var(--accent-line);border-radius:4px;padding:1px 5px;margin-top:2px;
}
.say p{font-size:12.5px;line-height:1.7;color:var(--ink-2)}

.q{border-top:1px solid var(--line);margin-top:16px;padding-top:15px}
.q.current{animation:rise .24s ease both}
.q-head{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
.q-num{font-size:9.5px;color:var(--faint);letter-spacing:.06em;flex:none}
.q h3{font-size:13.5px;font-weight:600;line-height:1.5}
.q .hint{font-size:10.5px;color:var(--muted);margin-bottom:9px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opts.trio{grid-template-columns:1fr 1fr 1fr}
.opt{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  border:1px solid var(--line);background:var(--paper-2);border-radius:7px;
  padding:8px 9px;font-size:12px;text-align:left;cursor:pointer;line-height:1.4;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.opt:hover{border-color:var(--accent-line);background:var(--tint)}
.opt.on{border-color:var(--accent);background:var(--tint);color:var(--accent-2)}
.opt .ok{width:14px;height:14px;flex:none;color:var(--accent)}
.osub{display:block;font-size:9.5px;color:var(--muted);font-weight:400;margin-top:1px;line-height:1.45}
.opt.on .osub{color:var(--accent-2);opacity:.85}
.answered{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;font-size:12px;color:var(--muted)}
.answered .val{border:1px solid var(--accent-line);background:var(--tint);color:var(--accent-2);border-radius:5px;padding:2px 8px;font-size:12px}
.answered .val.multi{display:flex;gap:5px;flex-wrap:wrap;padding:2px 4px;background:transparent;border:0}
.answered .val.multi span{border:1px solid var(--accent-line);background:var(--tint);border-radius:4px;padding:1px 6px}
.freefield{margin-top:2px}
.freefield textarea{
  width:100%;border:1px solid var(--line-2);border-radius:7px;background:var(--paper-2);
  padding:9px 10px;min-height:64px;resize:vertical;outline:none;font-family:inherit;font-size:12.5px;line-height:1.6;
}
.freefield textarea:focus{border-color:var(--accent-line)}
.freefield textarea::placeholder{color:var(--faint)}
.examples{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ex{
  border:1px dashed var(--line-2);background:transparent;border-radius:5px;
  font-size:10.5px;color:var(--muted);padding:4px 7px;cursor:pointer;text-align:left;line-height:1.4;
}
.ex:hover{border-color:var(--accent-line);background:var(--tint);color:var(--accent-2)}

.summary{
  border:1px solid var(--accent-line);background:var(--tint);border-radius:10px;
  padding:15px;margin-top:18px;animation:rise .26s ease both;
}
.summary .eyebrow{margin-bottom:5px}
.summary h3{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.35}
.three{list-style:none;margin:10px 0 4px;display:flex;flex-direction:column}
.three li{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--accent-line);font-size:12px;line-height:1.6;color:var(--ink-2)}
.three li .i{
  flex:none;width:16px;height:16px;border:1px solid var(--accent-line);background:var(--paper-2);
  color:var(--accent-2);border-radius:50%;display:grid;place-items:center;font-size:9px;margin-top:2px;
}
.summary .note{font-size:10.5px;color:var(--muted);margin-top:6px}
.roundhead{
  display:flex;align-items:center;gap:8px;margin:18px 0 0;padding-top:16px;
  border-top:1px solid var(--line-2);font-size:10px;letter-spacing:.14em;color:var(--muted);
}
.roundhead .bar{flex:1;height:1px;background:var(--line)}
.roundhead b{font-weight:500;color:var(--ink-2);letter-spacing:.08em}
.recap{border:1px solid var(--line);background:var(--paper-2);border-radius:9px;padding:11px 12px;margin-top:12px}
.recap-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.recap-top .eyebrow{font-size:9.5px}
.recap p{font-size:11.5px;color:var(--ink-2);line-height:1.65}
.recap p + p{margin-top:3px}
.recap .rnote{color:var(--muted);font-size:10.5px}

/* carrier cards */
.carriers{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.carrier{
  position:relative;border:1px solid var(--line);background:var(--paper-2);border-radius:9px;
  padding:9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  transition:border-color .13s ease,background .13s ease;
}
.carrier:hover{border-color:var(--accent-line);background:var(--tint)}
.carrier.on{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.carrier-top{display:flex;align-items:center;gap:7px}
.carrier .cname{font-size:11.5px;font-weight:600;line-height:1.4}
.carrier .t{font-size:9px;color:var(--muted);margin-left:auto;border:1px solid var(--line);border-radius:3px;padding:0 3px;background:var(--paper);white-space:nowrap}
.carrier .cgo,.carrier .cbad{font-size:10px;line-height:1.45;display:flex;gap:4px;align-items:flex-start;color:var(--ink-2)}
.carrier .cgo .k,.carrier .cbad .k{flex:none;margin-top:2px}
.carrier .cgo .k{color:var(--green)}
.carrier .cbad .k{color:var(--amber)}
.carrier .badge{position:absolute;top:7px;right:7px;width:15px;height:15px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.mini{
  position:relative;width:30px;height:48px;border:1px solid var(--line-2);border-radius:5px;
  background:var(--paper);padding:3px;flex:none;overflow:hidden;
}
.mini .mb{display:block;height:2px;border-radius:1px;background:var(--line);margin-bottom:2px}
.mini .mb.w1{width:70%}
.mini .mb.w2{width:100%}
.mini .mb.acc{background:var(--accent-line)}
.mini .mh{height:5px;border-bottom:1px solid var(--line);margin:-3px -3px 4px;display:flex;align-items:center;justify-content:flex-end;padding-right:2px}
.mini .mh i{display:block;width:1px;height:3px;background:var(--line-2);margin-left:1px}
.carrier-detail{border:1px dashed var(--accent-line);background:var(--tint);border-radius:7px;padding:8px 9px;margin-top:8px;font-size:11px;line-height:1.6;color:var(--accent-2)}
.carrier-detail b{font-weight:600}

/* pay scenario */
.scenarios{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.scenario{
  border:1px solid var(--line);background:var(--paper-2);border-radius:8px;padding:8px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;
}
.scenario:hover{border-color:var(--accent-line);background:var(--tint)}
.scenario.on{border-color:var(--accent);background:var(--tint)}
.scenario .art{border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:1px;color:var(--ink-2)}
.scenario b{font-size:10.5px;font-weight:600}
.scenario span{font-size:9.5px;color:var(--muted);line-height:1.45}

/* tech cards */
.tech{border:1px solid var(--line);background:var(--paper-2);border-radius:10px;padding:11px;margin-top:12px;animation:rise .22s ease both}
.tech-head{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}
.tech-head .n{font-size:9.5px;color:var(--faint)}
.tech-head h4{font-size:12.5px;font-weight:600}
.tech-head .st{margin-left:auto;font-size:9.5px;color:var(--muted)}
.tech.delegated{border-style:dashed;border-color:var(--amber-line);background:var(--amber-tint)}
.tech.delegated .st{color:var(--amber)}
.tech.delegated{animation:fly .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes fly{0%{transform:translateX(0);opacity:.7}55%{transform:translateX(9px);opacity:1}100%{transform:none}}
.trow{
  display:grid;grid-template-columns:62px 1fr 1fr;gap:7px;align-items:start;
  border-top:1px dashed var(--line);padding:8px 0;cursor:pointer;text-align:left;width:100%;
  background:transparent;border-left:0;border-right:0;border-bottom:0;
}
.trow:first-of-type{border-top:1px solid var(--line)}
.trow:hover .tname{color:var(--accent-2)}
.trow.on .tname{color:var(--accent-2)}
.trow.on .tname::after{content:"✓";margin-left:4px;font-size:9px}
.tname{font-size:11px;font-weight:600;line-height:1.4}
.tname .note{display:block;font-size:9px;color:var(--muted);font-weight:400;margin-top:1px}
.tname .rec{display:inline-block;margin-left:4px;font-size:8px;color:var(--green);border:1px solid var(--green-line);background:var(--green-tint);border-radius:3px;padding:0 3px;line-height:1.5;font-weight:400;vertical-align:1px}
.tcell{display:flex;gap:4px;font-size:9.5px;line-height:1.45;color:var(--ink-2)}
.tcell .k{flex:none;margin-top:2px;color:var(--green)}
.tcell.bad .k{color:var(--amber)}
.tech .actions{display:flex;align-items:center;gap:8px;margin-top:9px}
.btn-delegate{
  flex:1;border:1px solid var(--accent-line);background:var(--tint);color:var(--accent-2);
  border-radius:7px;padding:9px 10px;font-size:11.5px;cursor:pointer;text-align:center;
  transition:background .12s ease,border-color .12s ease;
}
.btn-delegate:hover{background:var(--tint-2);border-color:var(--accent)}
.btn-delegate[disabled]{background:var(--amber-tint);border-color:var(--amber-line);color:var(--amber);cursor:default}
.delegated-note{border-top:1px dashed var(--amber-line);margin-top:9px;padding-top:8px;font-size:10.5px;color:var(--amber);line-height:1.55}
.delegated-note b{font-weight:600}
.tech .undo{font-size:10px}

/* ---------- visual / phones ---------- */
.visual{min-width:0}
.visual-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.visual-head .r{display:flex;align-items:center;gap:10px}
.visual-head .tag{font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.visual-note{font-size:10.5px;color:var(--faint);text-align:right}
.legend{display:flex;justify-content:center;gap:20px;align-items:center;margin:8px 0 2px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border:1px solid var(--line-2);border-radius:2px;display:inline-block;background:var(--paper-2)}
.legend .f i{border-color:var(--accent-line);background:var(--tint)}
.legend .b i{border-color:var(--ink-2);background:var(--bg-2)}

.phones{min-height:720px;display:flex;justify-content:center;align-items:flex-start;padding-top:6px}
.stack{position:relative;width:612px;height:716px;flex:none}
.phone{
  position:absolute;width:300px;height:620px;padding:8px;border-radius:38px;
  background:var(--paper);border:1px solid var(--line-2);
  box-shadow:0 30px 60px -46px rgba(33,30,24,.55);
}
.phone.back{left:306px;top:4px;transform:rotate(4.5deg);background:#f8f3e9;z-index:1}
.phone.front{left:0;top:74px;transform:rotate(-.8deg);z-index:2}
.screen{
  height:100%;border-radius:30px;border:1px solid #e7e0d0;background:var(--paper-2);
  display:flex;flex-direction:column;overflow:hidden;animation:softin .3s ease both;
}
.ph-tag{
  position:absolute;top:-19px;left:14px;font-size:9.5px;color:var(--muted);
  letter-spacing:.1em;display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.ph-tag i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.phone.back .ph-tag i{background:var(--ink-2)}

.shell{flex:none;border-bottom:1px solid var(--line);background:#fbf7ee}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:7px 13px 2px;font-size:8.5px;color:var(--ink-2)}
.statusbar .r{display:flex;gap:3px;align-items:flex-end}
.statusbar .r i{display:block;width:2px;background:var(--ink-2);border-radius:1px}
.statusbar .r i:nth-child(1){height:3px}
.statusbar .r i:nth-child(2){height:5px}
.statusbar .r i:nth-child(3){height:7px}
.statusbar .batt{width:12px;height:6px;border:1px solid var(--ink-2);border-radius:1px;position:relative;margin-left:2px}
.statusbar .batt::after{content:"";position:absolute;right:-3px;top:17%;height:66%;width:2px;background:var(--ink-2);border-radius:0 1px 1px 0}
.wxnav{display:flex;align-items:center;gap:6px;padding:3px 10px 7px;font-size:10.5px}
.wxnav .bk{color:var(--ink-2)}
.wxnav .ttl{flex:1;text-align:center;font-weight:600;font-size:11px;padding-right:38px}
.capsule{display:flex;align-items:center;gap:3px;border:1px solid var(--line-2);border-radius:99px;padding:2px 6px;height:16px;background:var(--paper-2)}
.capsule i{width:2.5px;height:2.5px;background:var(--ink-2);border-radius:50%}
.capsule .dot{width:7px;height:7px;border:1px solid var(--ink-2);border-radius:50%;margin-left:2px}
.officialnav{display:flex;align-items:center;gap:7px;padding:6px 11px 8px}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:9.5px;flex:none}
.officialnav b{font-size:10.5px;font-weight:600;line-height:1.2}
.officialnav small{display:block;font-size:8px;color:var(--muted);font-weight:400}
.follow{margin-left:auto;font-size:8.5px;border:1px solid var(--green-line);background:var(--green-tint);color:var(--green);border-radius:99px;padding:2px 6px}
.webnav{padding:6px 9px 7px;display:flex;align-items:center;gap:6px}
.urlbar{flex:1;display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;background:var(--paper);padding:3px 8px;font-size:8.5px;color:var(--muted);min-width:0}
.urlbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appnav{display:flex;align-items:center;gap:8px;padding:4px 12px 8px;font-size:10px}
.appnav b{font-size:10.5px;font-weight:600;flex:1}
.entry{
  display:flex;align-items:center;gap:5px;margin:8px 11px 0;padding:5px 7px;
  border:1px dashed var(--line-2);border-radius:5px;font-size:8.5px;color:var(--muted);
  background:rgba(255,255,255,.4);
}
.entry .k{color:var(--accent-2);flex:none}
.app-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:11px 12px 8px;overflow:hidden}
.ph-eyebrow{font-size:8px;letter-spacing:.1em;color:var(--muted)}
.hero h3{font-size:16.5px;line-height:1.32;font-weight:600;margin:1px 0 3px;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero p{font-size:9px;color:var(--muted);line-height:1.5}
.slot,.prow{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 8px;
}
.slot b,.prow b{font-size:10px;font-weight:600;line-height:1.4}
.slot small,.prow small{display:block;font-size:8px;color:var(--muted);font-weight:400}
.slot .n{font-size:8.5px;color:var(--muted);white-space:nowrap}
.slot.sel{border-color:var(--accent);background:var(--tint)}
.slot.sel .n{color:var(--accent-2)}
.prow .price{font-size:13px;font-weight:600;letter-spacing:.02em}
.prow .price em{font-size:8px;font-style:normal;font-weight:400;color:var(--muted);margin-left:1px}
.ph-cta{background:var(--accent);color:#fff;border-radius:6px;text-align:center;font-size:10px;padding:8px;margin-top:6px}
.ph-info{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.ph-info .promo{border:1px dashed var(--line-2);border-radius:5px;padding:5px 6px;font-size:8.5px;color:var(--ink-2);background:#fffdf7;line-height:1.5}
.ph-info .row{display:flex;justify-content:space-between;gap:6px;border-top:1px dashed var(--line);padding-top:4px;font-size:8.5px;color:var(--muted)}
.ph-info .row b{font-weight:500;color:var(--ink-2)}
.ph-btnrow{display:flex;gap:6px;margin-top:2px}
.ph-btn{flex:1;border:1px solid var(--line-2);border-radius:6px;text-align:center;font-size:9.5px;padding:7px;background:#fff}
.ph-btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.ph-field{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:6px 1px;font-size:9px;color:var(--muted)}
.ph-field i{flex:1;height:1px;background:var(--line)}
.ph-formnote{margin-top:auto;border:1px dashed var(--line-2);border-radius:5px;padding:6px;font-size:8.5px;color:var(--muted);text-align:center}
.integ{
  display:flex;align-items:center;gap:5px;border:1px dashed var(--accent-line);background:var(--tint);
  color:var(--accent-2);border-radius:5px;padding:4px 6px;font-size:8.5px;line-height:1.4;
}
.payrow{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line);background:#faf6ec;padding:7px 12px;font-size:8.5px;color:var(--ink-2)}
.payrow .r{color:var(--muted)}
.payrow .k{color:var(--muted)}
.ph-foot{flex:none;border-top:1px dashed var(--line);padding:5px 12px 7px;font-size:7.5px;color:var(--faint);display:flex;justify-content:space-between}
.ph-skel{display:flex;flex-direction:column;gap:6px;margin-top:auto;margin-bottom:auto;align-items:center;text-align:center;padding:10px}
.ph-skel .ghost{width:100%;height:24px;border:1px dashed var(--line-2);border-radius:5px;background:var(--paper)}
.ph-skel .skel-ic{width:36px;height:36px;border:1px dashed var(--line-2);border-radius:50%;display:grid;place-items:center;color:var(--faint);margin-bottom:2px}
.bghost{height:26px;border:1px dashed var(--line-2);border-radius:5px;background:rgba(255,255,255,.4)}
.ph-skel p{font-size:9px;color:var(--faint);line-height:1.5;margin-top:4px}

/* back phone */
.back-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:11px 12px 9px;overflow:hidden}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bhead b{font-size:11px;font-weight:600}
.bhead .t{font-size:8px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:#fff}
.bstats{display:flex;gap:5px}
.bstat{flex:1;border:1px solid var(--line);border-radius:5px;background:#fff;padding:5px 6px}
.bstat .k{font-size:7.5px;color:var(--muted);letter-spacing:.05em}
.bstat .v{font-size:13px;font-weight:600;line-height:1.3}
.bstat .v em{font-style:normal;font-size:7.5px;font-weight:400;color:var(--muted);margin-left:1px}
.bsec h5{font-size:8px;letter-spacing:.1em;color:var(--muted);margin:0 0 3px;font-weight:500}
.brow{display:flex;align-items:center;gap:5px;justify-content:space-between;font-size:8.5px;padding:3.5px 0;border-top:1px dashed var(--line);line-height:1.4}
.brow .l{display:flex;align-items:center;gap:4px;min-width:0}
.brow .l b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .dot{width:4px;height:4px;border-radius:50%;background:var(--line-2);flex:none}
.brow .dot.done{background:var(--green)}
.brow .dot.wait{background:var(--amber)}
.brow .r{color:var(--muted);font-size:8px;white-space:nowrap}
.btags{display:flex;flex-wrap:wrap;gap:3px}
.btag{font-size:7.5px;border:1px solid var(--line-2);border-radius:3px;padding:1px 4px;color:var(--muted);background:#fff;line-height:1.5}
.bnote{border:1px dashed var(--line-2);border-radius:5px;padding:6px;font-size:8.5px;color:var(--muted);text-align:center;line-height:1.5;background:rgba(255,255,255,.4)}
.bdone{border:1px solid var(--accent-line);background:var(--tint);border-radius:5px;padding:5px 6px;font-size:8px;line-height:1.5;color:var(--accent-2)}
.bpay{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);border-top:1px solid var(--line);padding-top:5px;margin-top:auto}
.hl{outline:2px solid var(--accent);outline-offset:2px;background:var(--tint) !important;border-radius:4px}
[data-el]{transition:background .12s ease,outline-color .12s ease}
.confirm .phones [data-el]{cursor:pointer}
.confirm .phones [data-el]:hover{outline:1px dashed var(--accent);outline-offset:2px;border-radius:4px}

/* solo + compare strip (variant B) */
.solo{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.solo .phone{position:relative;left:auto;top:auto;transform:none}
.solo .ph-tag{left:12px}
.cstrip{
  width:100%;max-width:520px;border:1px solid var(--line);background:var(--paper);
  border-radius:10px;padding:12px 14px;
}
.cstrip-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.cstrip-head .eyebrow{font-size:9.5px}
.cstrip-head .n{font-size:9.5px;color:var(--faint)}
.crow{display:grid;grid-template-columns:1fr 18px 1.15fr;gap:6px;align-items:start;padding:6px 0;border-top:1px dashed var(--line);font-size:10.5px;line-height:1.5}
.crow .a{color:var(--muted)}
.crow .arw{color:var(--faint);display:flex;justify-content:center;padding-top:1px}
.crow .b{color:var(--ink-2)}
.crow .b b{font-weight:600;color:var(--ink)}
.cstrip .foot{margin-top:7px;font-size:9.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:6px;line-height:1.5}
.solo-legend{margin-bottom:0}

/* ledger */
.ledger{
  display:grid;grid-template-columns:1fr 1fr;gap:26px;
  border-top:1px solid var(--line-2);margin-top:16px;padding-top:13px;
  max-width:680px;margin-left:auto;margin-right:auto;
}
.ledger h4{font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.ledger h4 .c{font-size:9px;border:1px solid var(--line);border-radius:99px;padding:0 5px;color:var(--faint);letter-spacing:0;background:var(--paper)}
.ledger ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.ledger li{font-size:11px;line-height:1.5;display:flex;gap:6px;align-items:flex-start;color:var(--ink-2)}
.ledger li .k{flex:none;color:var(--green);margin-top:2px}
.ledger .pending li{color:var(--muted)}
.ledger .pending li .k{color:var(--amber);margin-top:2px}
.ledger li.empty{color:var(--faint);font-size:10.5px;padding-left:12px}
.ledger li em{font-style:normal;color:var(--faint);font-size:9.5px;margin-left:2px}

/* ---------- confirm ---------- */
.confirm{padding-top:2px}
.confirm h2{font-family:var(--serif);font-size:25px;line-height:1.3;font-weight:600;margin:4px 0 6px}
.confirm .lede{font-size:11.5px;color:var(--muted);line-height:1.6}
.clines{list-style:none;margin:14px 0 0;border-top:1px solid var(--line-2)}
.cline{
  padding:10px 10px 10px 12px;margin:0 -10px;border-radius:7px;border-bottom:1px solid var(--line);
  cursor:pointer;position:relative;transition:background .12s ease;
}
.cline:hover{background:var(--paper-2)}
.cline.sel{background:var(--tint);box-shadow:inset 2px 0 0 var(--accent)}
.cline-top{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.cline-top .n{font-size:9px;color:var(--faint);letter-spacing:.08em;flex:none}
.cline-top .lab{font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.cline-top .edit{margin-left:auto;flex:none}
.cline .txt{font-size:12.5px;line-height:1.55;color:var(--ink);padding-right:24px}
.cline.sel .txt{color:var(--accent-2)}
.cline .editbox{display:flex;gap:6px;margin-top:4px}
.cline input{
  flex:1;border:1px solid var(--accent-line);border-radius:6px;background:var(--paper-2);
  padding:6px 8px;font-size:12px;outline:none;min-width:0;color:var(--ink);
}
.cline input:focus{border-color:var(--accent)}
.nolist{margin-top:14px}
.nolist .lab{font-size:9.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:5px}
.nolist .chips{display:flex;flex-wrap:wrap;gap:4px}
.nolist .no{border:1px solid var(--red-line);background:var(--red-tint);color:var(--red);border-radius:4px;padding:2px 6px;font-size:10px;line-height:1.5}
.nolist .none{font-size:10.5px;color:var(--faint)}
.confirm-actions{margin-top:16px}
.confirm-actions .fine{font-size:9.5px;color:var(--faint);margin-top:7px;line-height:1.5}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.act{
  display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--paper-2);
  border-radius:7px;padding:8px 10px;font-size:11.5px;animation:rise .26s ease both;
}
.act .ic{color:var(--green);flex:none}
.act .t{margin-left:auto;font-size:8.5px;color:var(--faint);letter-spacing:.06em}
.act.done{border-color:var(--green-line);background:var(--green-tint)}
.goto{
  border:1px solid var(--accent-line);background:var(--tint);border-radius:9px;padding:12px;
  margin-top:12px;animation:rise .3s ease both;
}
.goto p{font-size:11px;color:var(--ink-2);line-height:1.6;margin-bottom:8px}

/* ---------- factory ---------- */
.factory{padding-bottom:10px}
body.is-factory .switchbar,body.is-factory .help-btn,body.is-factory .help-panel{display:none}
.ticketbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line-2);background:var(--paper);border-radius:10px;padding:11px 14px;
}
.ticketbar .id{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;letter-spacing:.02em}
.ticketbar b{font-size:13px;font-weight:600}
.ticketbar .client{font-size:11px;color:var(--muted)}
.ticketbar .grow{flex:1}
.tstatus{
  font-family:var(--mono);font-size:10px;border:1px solid var(--green-line);background:var(--green-tint);
  color:var(--green);border-radius:4px;padding:2px 7px;letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:3px;cursor:pointer;
}
button.tstatus:hover{border-color:var(--ink-2)}
.tstatus.wait{border-color:var(--amber-line);background:var(--amber-tint);color:var(--amber)}
.tstatus.done{border-color:var(--green-line);background:var(--green-tint);color:var(--green)}
.tstatus.draft{border-color:var(--line-2);background:var(--bg-2);color:var(--muted)}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
.fhead .l{display:flex;align-items:baseline;gap:10px}
.fhead h2{font-family:var(--serif);font-size:20px;font-weight:600}
.fhead .note{font-size:10.5px;color:var(--muted)}
.legend-sk{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.legend-sk .sk{cursor:default}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:16px}
.pstep{
  position:relative;border:1px solid var(--line);background:var(--paper);border-radius:9px;
  padding:9px 9px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;
  min-height:128px;transition:border-color .13s ease,background .13s ease;
}
.pstep:hover{border-color:var(--accent-line);background:var(--tint)}
.pstep.on{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.pstep .n{font-size:8.5px;color:var(--faint);letter-spacing:.08em}
.pstep .pname{font-size:12px;font-weight:600;line-height:1.3}
.pstep .out{font-size:9.5px;color:var(--muted);line-height:1.45}
.pstep .skrow{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;padding-top:3px}
.pstep .who{font-size:8.5px;color:var(--faint)}
.pstep:not(:last-child)::after{
  content:"";position:absolute;right:-6px;top:50%;width:5px;height:5px;
  border-top:1px solid var(--line-2);border-right:1px solid var(--line-2);
  transform:translateY(-50%) rotate(45deg);
}
.sk{
  font-family:var(--mono);font-size:8px;line-height:1.6;border:1px solid var(--line-2);
  border-radius:3px;padding:0 4px;white-space:nowrap;letter-spacing:-.01em;
}
.sk[data-t="remix"]{color:var(--accent-2);border-color:var(--accent-line);background:var(--tint)}
.sk[data-t="direct"]{color:var(--ink-2);border-color:var(--line-2);background:var(--bg-2)}
.sk[data-t="cond"]{color:var(--amber);border-color:var(--amber-line);background:var(--amber-tint);border-style:dashed}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;align-items:start}
.blocks{display:flex;flex-direction:column;gap:11px;min-width:0}
.block{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:13px 15px}
.block-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.block-head .n{font-size:9px;color:var(--faint);letter-spacing:.08em}
.block-head h3{font-size:13px;font-weight:600}
.block-head .note{margin-left:auto;font-size:9.5px;color:var(--muted)}
.block .desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.once{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.cond{display:grid;grid-template-columns:128px 1fr;gap:8px;align-items:start;padding:7px 0;border-top:1px dashed var(--line)}
.cond:first-of-type{border-top:0;padding-top:2px}
.cond .why{font-size:10.5px;color:var(--ink-2);line-height:1.5}
.gate{padding:8px 0;border-top:1px dashed var(--line)}
.gate:first-of-type{border-top:0;padding-top:2px}
.gate-q{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.gate-q .n{font-size:8.5px;color:var(--faint)}
.gate-q b{font-size:11.5px;font-weight:600}
.gate-q .from{font-size:9px;color:var(--accent-2);border:1px solid var(--accent-line);background:var(--tint);border-radius:3px;padding:0 4px}
.gate-q .count{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--faint)}
.gopts{display:flex;flex-wrap:wrap;gap:4px}
.gopt{
  display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--paper-2);
  border-radius:5px;padding:4px 6px;font-size:10px;line-height:1.4;cursor:pointer;
}
.gopt:hover{border-color:var(--accent-line);background:var(--tint)}
.gopt.on{border-color:var(--accent);background:var(--tint);color:var(--accent-2)}
.gopt em{font-style:normal;font-size:7.5px;color:var(--green);border:1px solid var(--green-line);background:var(--green-tint);border-radius:2px;padding:0 2px;line-height:1.5}
.gate .remind{font-family:var(--mono);font-size:8.5px;color:var(--faint);margin-top:5px}
.detail{
  position:sticky;top:16px;border:1px solid var(--line-2);background:var(--paper);
  border-radius:11px;padding:15px;min-height:360px;
}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.detail h2{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.25;margin:2px 0 3px}
.detail .sub{font-size:10.5px;color:var(--muted);line-height:1.55}
.detail .skrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.dsec{border-top:1px solid var(--line);padding-top:9px;margin-top:11px}
.dsec h4{font-size:8.5px;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-bottom:3px}
.dsec p{font-size:11.5px;line-height:1.65;color:var(--ink-2)}
.dwho{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}

function readVariant(){
  try {
    const v = new URL(location.href).searchParams.get('variant');
    if (v && v.toUpperCase() === 'B') return 'B';
  } catch (e) {}
  return /variant=B/i.test(location.hash || '') ? 'B' : 'A';
}
function writeVariant(v){
  try {
    const u = new URL(location.href);
    u.searchParams.set('variant', v);
    history.replaceState(null, '', u.href);
  } catch (e) {}
}

function ledgerHTML(){
  const done = [];
  const pending = [];
  if (S.audience) done.push(['给谁用', S.audience]);
  if (S.action) done.push(['第一件事', S.action]);
  if (S.how) done.push(['现在', S.how]);
  if (S.excludesDone) done.push(['不做', S.excludes.length ? S.excludes.join(' / ') : '按最小做']);
  if (S.carrier) done.push(['载体', CARRIERS[S.carrier].name]);
  if (S.found) done.push(['入口', FOUND[S.found].label]);
  if (S.pay) done.push(['付钱', S.pay === '要' ? '在线付' : S.pay === '不要' ? '到店付' : '还没定']);
  if (S.existingDone) done.push(['要接上', S.existing.length ? S.existing.join(' / ') : '没有']);
  if (S.experience) done.push(['做过的', EXP[S.experience]]);
  ['data','account','budget'].forEach(k => {
    if (S.tech[k]) done.push([TECH[k].title, TECH_LABEL[k][S.tech[k]]]);
    else if (S.delegated[k]) pending.push([TECH[k].title, '等你定']);
  });
  if (!S.carrier) pending.push(['载体', '']);
  if (S.carrier && !S.found) pending.push(['入口', '']);
  if (S.found && !S.pay) pending.push(['付钱', '']);
  if (S.pay && !S.existingDone) pending.push(['要接什么', '']);
  if ((S.round === 3 || S.round === 'confirm' || S.experience) && !S.delegated.data && !S.delegated.account && !S.delegated.budget) {
    techPendingList().forEach(k => { if (!pending.some(p => p[0] === TECH[k].title)) pending.push([TECH[k].title, '']); });
  }

  const li = (row, kind) => '<li><span class="k">' + ic(kind === 'done' ? 'check' : 'clock', 9) + '</span><span>' + esc(row[0]) + (row[1] ? '：' + esc(row[1]) : '') + (row[1] === '等你定' ? '<em>开工前你点头</em>' : '') + '</span></li>';
  const left = done.length ? done.map(r => li(r, 'done')).join('') : '<li class="empty">还没有。答一句就长一条。</li>';
  const right = pending.length ? pending.map(r => li(r, 'wait')).join('') : '<li class="empty">' + (S.confirmed ? '没有悬着的，已经进队列。' : '没有悬着的。') + '</li>';
  return '<div class="ledger">' +
    '<div><h4>已定 <span class="c">' + done.length + '</span></h4><ul>' + left + '</ul></div>' +
    '<div class="pending"><h4>待定 <span class="c">' + pending.length + '</span></h4><ul>' + right + '</ul></div>' +
    '</div>';
}

/* ================= 动作 ================= */
function toast(msg){
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}
function clearTimers(){ if (actionTimer) { clearInterval(actionTimer); actionTimer = null; } }
function submitRaw(){
  const ta = $('#rawInput');
  const v = ((ta ? ta.value : '') || S.rawDraft || '').trim();
  if (v.length < 4) { toast('再多写一句，哪怕只有五个字。'); if (ta) ta.focus(); return; }
  S.raw = v; S.rawDraft = v;
  S.industry = S.industryHint || guessIndustry(v);
  S.scrollBottom = true;
  render();
}
function answer(key, v){
  if (key === 'pay' && v === '说不清') {
    S.payUnsure = true; S.pay = null; S.scrollBottom = true; render(); return;
  }
  S[key] = v;
  if (key === 'how' && !S.compareSeen) { S.compareOpen = true; S.compareSeen = true; }
  if (key === 'pay') {
    S.payUnsure = false;
    if (v === '要' && S.excludes.indexOf('支付') >= 0) {
      S.excludes = S.excludes.filter(x => x !== '支付');
      toast('已从「不做」里拿掉支付。');
    }
    if (v !== '说不清' && S.pay !== '说不清') { /* keep */ }
  }
  S.scrollBottom = true;
  render();
}
function revise(key){
  if (key === 'carrier') { S.carrier = null; S.scrollBottom = false; render(); return; }
  if (key === 'found') { S.found = null; S.scrollBottom = false; render(); return; }
  if (key === 'pay') { S.pay = null; S.payUnsure = false; S.scrollBottom = false; render(); return; }
  if (key === 'existing') { S.existingDone = false; S.existingDraft = S.existing.slice(); S.scrollBottom = false; render(); return; }
  if (key === 'experience') { S.experience = null; S.scrollBottom = false; render(); return; }
  const order = ['audience','action','how','done','excludes'];
  const i = order.indexOf(key);
  if (i < 0) return;
  for (let j = i; j < order.length; j++) {
    if (order[j] === 'done') { S.done = null; S.doneDraft = ''; }
    else if (order[j] === 'excludes') { S.excludes = []; S.excludeDraft = []; S.excludesDone = false; }
    else S[order[j]] = null;
  }
  S.scrollBottom = false;
  render();
  toast('这一题重答。后面的会跟着清掉。');
}
function toggleExclude(v){
  let d = S.excludeDraft.slice();
  if (v === '都没有') {
    d = d.indexOf('都没有') >= 0 ? [] : ['都没有'];
  } else {
    d = d.filter(x => x !== '都没有');
    d = d.indexOf(v) >= 0 ? d.filter(x => x !== v) : d.concat([v]);
  }
  S.excludeDraft = d;
  render();
}
function toggleExisting(v){
  let d = S.existingDraft.slice();
  if (v === '没有') {
    d = d.indexOf('没有') >= 0 ? [] : ['没有'];
  } else {
    d = d.filter(x => x !== '没有');
    d = d.indexOf(v) >= 0 ? d.filter(x => x !== v) : d.concat([v]);
  }
  S.existingDraft = d;
  render();
}
function submitExcludes(){
  S.excludes = S.excludeDraft.filter(x => x !== '都没有');
  S.excludesDone = true;
  S.scrollBottom = true;
  render();
}
function submitExisting(){
  S.existing = S.existingDraft.filter(x => x !== '没有');
  S.existingDone = true;
  S.scrollBottom = true;
  render();
}
function submitDone(){
  const ta = $('#doneInput');
  const v = ((ta ? ta.value : '') || S.doneDraft || '').trim();
  if (v.length < 2) { toast('写一句看得见的完成，比如「后台能看到备货清单」。'); if (ta) ta.focus(); return; }
  S.done = v; S.doneDraft = v;
  S.scrollBottom = true;
  render();
}
function goRound(r){
  if (r === 2) {
    if (!S.excludesDone) return;
    S.round = 2;
  } else if (r === 3) {
    if (!r2done()) return;
    S.round = 3;
  } else if (r === 4) {
    if (!S.experience || techPendingList().length) return;
    S.round = 'confirm';
  }
  S.selLine = null; S.editing = null; S.scrollBottom = false; S.talkTop = true;
  render();
  window.scrollTo({top:0, behavior:'auto'});
}
function ensureRound1(){
  if (!S.raw) { S.raw = SAMPLES[0]; S.rawDraft = S.raw; S.industry = '预约'; }
  if (!S.audience) S.audience = '顾客';
  if (!S.action) S.action = '预约';
  if (!S.how) S.how = '微信接龙';
  if (!S.done) S.done = '后台能看到明天要备多少斤，街坊收到一条提醒。';
  if (!S.excludesDone) { S.excludes = ['登录','会员']; S.excludesDone = true; }
}
function ensureRound2(){
  if (!S.carrier) S.carrier = 'miniapp';
  if (!S.found) S.found = 'qr';
  if (!S.pay) { S.pay = '不要'; S.payUnsure = false; }
  if (!S.existingDone) { S.existing = ['微信群']; S.existingDone = true; }
}
function ensureRound3(){
  if (!S.experience) S.experience = 'none';
  ['data','account','budget'].forEach(k => { if (!techResolved(k)) S.delegated[k] = true; });
}
function jumpTo(r){
  const wasConfirmed = S.confirmed;
  clearTimers();
  S.view = 'customer';
  S.compareOpen = false;
  if (r < 4) { S.confirmed = false; S.actions = 0; S.sim = 0; }
  S.editing = null; S.selLine = null;
  S.detail = {kind:'step', i:0};
  if (r >= 2) ensureRound1();
  if (r >= 3) ensureRound2();
  if (r >= 4) ensureRound3();
  S.round = r >= 4 ? 'confirm' : r;
  S.scrollBottom = false; S.talkTop = true;
  render();
  window.scrollTo({top:0, behavior:'auto'});
  if (r === 1) toast('从头看。左边可以直接写。');
  else toast(wasConfirmed && r === 4 ? '这张单已经确认过，工单在队列里。' : '为了看后面的屏，前面的答案补了默认值。');
}
function replay(){
  clearTimers();
  const variant = S.variant;
  S = blank();
  S.variant = variant;
  S.talkTop = true;
  document.body.style.overflow = '';
  render();
  window.scrollTo({top:0, behavior:'auto'});
  toast('回到第 1 步了。所有答案清空。');
}
function setVariant(v){
  S.variant = v;
  writeVariant(v);
  paintVariantBar();
  if (S.view === 'customer') render();
  else toast('A/B 只影响客户视角的右侧。现在看的是工厂。');
}
function confirmPlan(){
  if (S.confirmed) return;
  S.confirmed = true; S.actions = 0; S.selLine = null; S.editing = null;
  S.scrollBottom = false; S.talkTop = true;
  render();
  clearTimers();
  let n = 0;
  actionTimer = setInterval(() => {
    n += 1;
    S.actions = n;
    S.scrollBottom = true;
    if (S.view === 'customer') render();
    if (n >= 4) { clearTimers(); }
  }, 560);
}
function fillGates(){
  GATES.forEach(g => {
    if (S.gate[g.id] === undefined) {
      let idx = g.opts.findIndex(o => o[1]);
      if (idx < 0) idx = 0;
      S.gate[g.id] = idx;
    }
  });
}
function simAdvance(){
  if (!S.confirmed) { toast('先让客户点「就按这个来」。'); return; }
  if (S.actions < 4) { toast('四件事还没跑完，等一下。'); return; }
  if (S.sim >= 3) { toast('已经到完成了。重播可以再走一遍。'); return; }
  S.sim += 1;
  if (S.sim === 1) {
    fillGates();
    toast('按推荐点完技术闸门，机器开工（模拟）。');
  } else if (S.sim === 2) {
    toast('PR 和四样证据到了，等你验收（模拟）。');
  } else {
    toast('验收通过，合进主干（模拟）。');
  }
  S.detail = {kind:'state', i:currentState()};
  render();
}
function saveLine(){
  S.editing = null;
  render();
}
function applyLineInput(inp){
  const k = inp.dataset.k;
  const v = inp.value;
  if (v.trim()) S.lines[k] = v; else delete S.lines[k];
  $$('[data-el-text="' + k + '"]').forEach(n => { n.textContent = v.trim() ? v : ''; });
}
function collectLineText(){
  const inp = $('[data-line-input]');
  if (inp) {
    if (inp.value.trim()) S.lines[inp.dataset.k] = inp.value; else delete S.lines[inp.dataset.k];
  }
}

/* ================= 事件 ================= */
document.addEventListener('click', function(e){
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const a = actEl.dataset.act;
    if (a === 'modal-bg' && e.target !== actEl) return;
    if (a === 'sel-line') {
      if (e.target.closest('[data-act="edit-line"]') || e.target.closest('[data-act="save-line"]')) return;
      if (e.target.tagName === 'INPUT') return;
      if (S.round === 'confirm') { S.selLine = actEl.dataset.k; S.editing = null; render(); }
      return;
    }
    if (a === 'edit-line') {
      collectLineText();
      S.editing = actEl.dataset.k; S.selLine = actEl.dataset.k;
      render();
      return;
    }
    if (a === 'save-line') { collectLineText(); S.editing = null; render(); return; }
    if (a === 'fill') {
      const target = actEl.dataset.target;
      const text = actEl.dataset.text || '';
      if (target === 'raw') {
        S.rawDraft = text;
        if (actEl.dataset.ind) S.industryHint = actEl.dataset.ind;
        const ta = $('#rawInput');
        if (ta) { ta.value = text; ta.focus(); }
      } else if (target === 'done') {
        S.doneDraft = text;
        const ta = $('#doneInput');
        if (ta) { ta.value = text; ta.focus(); }
      }
      return;
    }
    switch (a) {
      case 'submit-raw': submitRaw(); return;
      case 'answer': answer(actEl.dataset.q, actEl.dataset.v); return;
      case 'revise': revise(actEl.dataset.q); return;
      case 'toggle-exclude': toggleExclude(actEl.dataset.v); return;
      case 'toggle-existing': toggleExisting(actEl.dataset.v); return;
      case 'submit-excludes': submitExcludes(); return;
      case 'submit-existing': submitExisting(); return;
      case 'submit-done': submitDone(); return;
      case 'round': goRound(parseInt(actEl.dataset.r, 10)); return;
      case 'carrier':
        S.carrier = actEl.dataset.v;
        S.scrollBottom = false;
        render();
        return;
      case 'experience':
        S.experience = actEl.dataset.v;
        S.scrollBottom = true;
        render();
        return;
      case 'tech': {
        const k = actEl.dataset.k;
        S.tech[k] = actEl.dataset.v;
        S.delegated[k] = false;
        S.scrollBottom = false;
        render();
        return;
      }
      case 'delegate': {
        const k = actEl.dataset.k;
        S.delegated[k] = true;
        S.tech[k] = null;
        S.scrollBottom = false;
        render();
        toast('已交给运营者。我会带 3 个选项和推荐。');
        return;
      }
      case 'undelegate': {
        const k = actEl.dataset.k;
        S.delegated[k] = false;
        render();
        return;
      }
      case 'confirm': collectLineText(); confirmPlan(); return;
      case 'to-factory':
        S.view = 'factory'; S.detail = {kind:'state', i:currentState()};
        render(); window.scrollTo({top:0, behavior:'auto'});
        toast('工厂视角。点流水线，或点右上角状态看状态带。');
        return;
      case 'close-compare':
        S.compareOpen = false; S.compareSeen = true; S.scrollBottom = true; render();
        return;
      case 'jump':
        jumpTo(parseInt(actEl.dataset.r, 10));
        return;
      case 'view':
        S.view = actEl.dataset.v;
        if (S.view === 'factory') S.detail = {kind:'state', i:currentState()};
        render(); window.scrollTo({top:0, behavior:'auto'});
        return;
      case 'replay': replay(); return;
      case 'variant-prev': setVariant(S.variant === 'A' ? 'B' : 'A'); return;
      case 'variant-next': setVariant(S.variant === 'A' ? 'B' : 'A'); return;
      case 'step':
        S.detail = {kind:'step', i:parseInt(actEl.dataset.i, 10)};
        render();
        return;
      case 'state':
        S.detail = {kind:'state', i:parseInt(actEl.dataset.i, 10)};
        render();
        return;
      case 'gate':
        S.gate[actEl.dataset.g] = parseInt(actEl.dataset.v, 10);
        render();
        return;
      case 'sim': simAdvance(); return;
      case 'jump-status': {
        const sb = $('#statusBand');
        if (sb) sb.scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      case 'jump-gate': {
        const g = $('#gateBlock');
        if (g) g.scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      case 'help-send': sendHelp(); return;
      default: return;
    }
  }

  const el = e.target.closest('[data-el]');
  if (el && S.round === 'confirm') {
    const k = el.dataset.el;
    if (k) { S.selLine = k; S.editing = null; render(); }
  }
});

document.addEventListener('input', function(e){
  const t = e.target;
  if (t.id === 'rawInput') S.rawDraft = t.value;
  else if (t.id === 'doneInput') S.doneDraft = t.value;
  else if (t.matches('[data-line-input]')) applyLineInput(t);
});

document.addEventListener('keydown', function(e){
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  if (e.key === 'Escape') {
    if (S.compareOpen) { S.compareOpen = false; S.compareSeen = true; render(); return; }
    closeHelp();
    return;
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && t) {
    if (t.id === 'rawInput') { e.preventDefault(); submitRaw(); return; }
    if (t.id === 'doneInput') { e.preventDefault(); submitDone(); return; }
  }
  if (e.key === 'Enter' && t && t.matches('[data-line-input]')) {
    e.preventDefault(); collectLineText(); S.editing = null; render(); return;
  }
  if (typing) return;
  if (S.compareOpen) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    setVariant(S.variant === 'A' ? 'B' : 'A');
  }
});

/* ================= 找人 ================= */
const helpBtn = $('#helpBtn');
const helpPanel = $('#helpPanel');
function closeHelp(){
  if (!helpPanel || helpPanel.hidden) return;
  helpPanel.hidden = true;
  if (helpBtn) helpBtn.setAttribute('aria-expanded', 'false');
}
function sendHelp(){
  const ta = $('#helpText');
  if (!ta) return;
  if (!ta.value.trim()) { toast('写一句再发。'); ta.focus(); return; }
  const text = ta.value.trim();
  ta.value = '';
  closeHelp();
  toast('记下了：' + clip(text, 18).replace(/[。！？!?，,]+$/, '') + '。运营者手机响了一下（模拟）。');
}
if (helpBtn && helpPanel) {
  helpBtn.addEventListener('click', function(){
    const open = helpPanel.hidden;
    helpPanel.hidden = !open;
    helpBtn.setAttribute('aria-expanded', String(open));
    if (open) { const t = $('#helpText'); if (t) t.focus(); }
  });
}
document.addEventListener('click', function(e){
  if (!helpPanel || helpPanel.hidden) return;
  if (helpPanel.contains(e.target) || (helpBtn && helpBtn.contains(e.target))) return;
  closeHelp();
});

/* ================= 启动 ================= */
render();
})();
</script>
</body>
</html>
