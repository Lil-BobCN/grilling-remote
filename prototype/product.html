<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>说清楚，再开工</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}

.brand{font-weight:600;display:flex;align-items:center;gap:8px}
.logo{width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11px}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 14px;border-radius:7px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg i{font:normal 11px var(--mono);background:var(--ac);color:#fff;border-radius:8px;padding:0 6px;margin-left:6px}
.sp{flex:1}
.mute{color:var(--mute)}
.sm{font-size:12px}
.col{max-width:700px;margin:0 auto;padding:36px 20px 80px}

.lede{color:var(--ink2)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ch b{font-weight:600}
.ch+p{margin-bottom:10px}
.pill{font-size:11px;border:1px solid var(--line2);border-radius:99px;padding:0 8px;color:var(--ink2);white-space:nowrap}
.pill.w{color:var(--warn);border-color:var(--warn)}
.pill.g{color:var(--ok);border-color:var(--ok)}
.btn{border:1px solid var(--line2);background:var(--sf);border-radius:8px;padding:7px 13px;cursor:pointer}
.btn:hover{background:var(--sub)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:3px 10px;font-size:12px}

.lk{border:0;background:none;color:var(--mute);cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.lk:hover{color:var(--ac)}
.bar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.bar .mute{flex:1}
.composer{border:1px solid var(--line2);border-radius:12px;margin-top:16px;background:var(--sf)}

.bub.ag{border:1px solid var(--line)}
.bub b{display:block;font-size:11px;color:var(--mute);font-weight:500}

.opts{display:flex;gap:8px;flex-wrap:wrap}

.opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}

.li input{flex:1}
.n{font:11px var(--mono);color:var(--mute);flex:none}

.dot.d{background:var(--ok);border-color:var(--ok)}

.steps .li{align-items:flex-start}

.th{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.mb{padding:7px 12px;border-radius:12px;max-width:85%;background:var(--sub)}
.mb.c{align-self:flex-end;background:var(--ink);color:var(--bg)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 48px)}
.rail{padding:12px 10px;border-right:1px solid var(--line);position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
.nav{display:flex;align-items:center;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink2)}
.nav:hover{background:var(--sub)}
.nav.on{background:var(--sub);color:var(--ink);box-shadow:inset 2px 0 0 var(--ac)}
.nav i{margin-left:auto;font:normal 11px var(--mono);color:var(--mute)}
.tk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12px;background:var(--sf)}
.main{padding:28px 32px 80px;max-width:900px}
.gate{padding:10px 0;border-top:1px solid var(--line)}
.gq{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.stg{display:flex;gap:4px;margin:6px 0}
.stg i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.stg i.d{background:var(--ok)}
.stg i.c{background:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

.chip.d{color:var(--ok);border-color:var(--ok)}
.chip.c{color:var(--ink);border-color:var(--ac)}
.log{font:12px/1.7 var(--mono);color:var(--ink2);max-height:300px;overflow:auto}
.log div{display:flex;gap:10px}
.log time{color:var(--mute);flex:none}
.ph{border:1px solid var(--line2);border-radius:14px;padding:12px;background:var(--bg);flex:1}
.sl{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:13px}
.sl.off{opacity:.5;background:var(--sub)}
.sl em{font-style:normal;color:var(--mute);font-size:12px}
.two{display:flex;gap:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
.col.wide{max-width:980px}.grid2{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}.side{position:sticky;top:64px;font-size:12px}.side .ans{padding:4px 0;gap:8px}.side .ans .el{width:76px}@media(max-width:820px){.grid2{grid-template-columns:1fr}.side{position:static}.shell{grid-template-columns:1fr}.rail{position:static;height:auto;border:0}.main{padding:20px 16px}.row{grid-template-columns:1fr}.top .mute{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

ed:d=>{S.ed=+d.i;S.dr.edin=S.sc[+d.i];render()},
edsave:d=>{const v=$('#edin').value.trim();if(v)S.sc[+d.i]=v;S.ed=-1;delete S.dr.edin;render()},
del:d=>{S.sc.splice(+d.i,1);S.ed=-1;delete S.dr.edin;render()},
sheet:()=>{if(!S.sc.length){toast('至少留一条');return}S.step='sheet';render()},
back:d=>{if(d.s==='round')return H.prev();S.step=d.s;render()},
confirm:()=>{S.st='queued';lg('客户确认：建客户仓，建 parent issue #127，标签 needs-triage');push(title()+' · 已进队列');render()},
csay:()=>{const v=$('#say').value.trim();if(!v)return;S.msgs.push({f:'c',t:v});setDraft('say','');lg('客户留言：'+clip(v,20));push(title()+' · 客户留言：'+clip(v,14));render()},
orep:()=>{const v=$('#rep').value.trim();if(!v)return;S.msgs.push({f:'o',t:v});setDraft('rep','');lg('运营者回复客户留言');render()},
asm:d=>{S.asm[+d.i]=1;render()},
gp:d=>{S.gate[d.g]=+d.o;render()},
gall:()=>{GATES.forEach(g=>{S.gate[g[0]]=0});render()},
gsmall:()=>{S.small=!S.small;render()},
gok:()=>{if(gN()<5)return;S.ti=0;S.si=0;if(S.small){S.tks=[['T1','直接实现：'+clip(S.raw,10)]];S.st='run'}else S.st='design';lg('闸门已答，'+(S.small?'小单直接实现，标签改 ready-for-agent':'标签改 ready-for-agent，等主机 agent 写 spec 和拆票'));render()},
seam:d=>{S.seam[+d.i]=S.seam[+d.i]?0:1;render()},
tkedit:d=>{S.te[+d.i]=1;render()},
sok:()=>{if(S.seam.some(x=>!x))return;S.st='run';S.ti=0;S.si=0;lg('你点了按这个拆，票已点头，每个客户只派一张');render()},
tick:()=>{tick();render()},
auto:()=>{if(auto){clearInterval(auto);auto=null}else{auto=setInterval(()=>{tick();const a=document.activeElement;if(!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')))render()},1200)}render()},
fault:()=>{if(S.st==='intake'){toast('还没有单子');return}if(S.fault){S.fault=false;S.stop='';lg('你换了令牌，从停下的那一步接着跑')}else{S.fault=true;S.stop='fault';lg('token 报 403，重试没用，不计圈数，停整条线');push(title()+' · 工厂故障，已停整条线')}render()},
fix:()=>{H.fault()},
bounce:()=>{if(S.st!=='run'||S.stop){toast('现在没有在跑的票');return}S.rd++;S.si=1;lg(S.tks[S.ti][0]+' 评审打回，第 '+S.rd+' 圈');if(S.rd>=3){S.stop='three';lg('三圈没进展，停这张票，推运营者');push(title()+' · 三圈没进展，已停这张票')}render()},
retry:()=>{S.stop='';S.rd=0;S.si=0;lg(S.tks[S.ti][0]+' 你说再试一次，重新开始');render()},
pass:()=>{S.st='live';lg('合主干，部署到预置环境，失败可回滚');push(title()+' · 完成 · 客户已收到地址');render()},
rej:()=>{S.rej++;S.tks=S.tks.concat([['R'+S.rej,'返工：按你的意见改']]);S.ti=S.tks.length-1;S.si=0;S.st='run';lg('你驳回，另开分支改，不重开单：R'+S.rej);push(title()+' · 驳回，返工中');render()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const f=H[el.dataset.act];if(f)f(el.dataset)});
render();
})();
</script>
</body>
</html>
