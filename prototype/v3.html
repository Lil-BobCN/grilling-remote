<!doctype html>
<html lang='zh-CN'>

<title>工厂流程 v3 原型</title>
<style>
:root{--bg:#faf9f5;--surface:#fff;--sub:#f2f0e8;--ink:#1f1e1d;--ink2:#57534e;--mute:#8b867c;--line:#e7e4db;--line2:#d5d1c4;--accent:#c15f3c;--ok:#3f7d58;--warn:#a46f16;--bad:#b4443a;--info:#3b6ea8;--sans:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;--serif:'Songti SC','Noto Serif CJK SC','Source Han Serif SC',serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}

ul,ol{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:48px 1fr;min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}

.nav .w{margin-left:auto;font-size:11px;color:var(--mute)}

.mute{color:var(--mute)}
.sm{font-size:12px}
.el{font:11px var(--mono);color:var(--mute)}

.btn:hover{background:var(--sub)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.sm{padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.own{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.frame{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;max-width:700px;margin-top:20px}

.say-q{font:600 24px/1.35 var(--serif);margin-bottom:6px}
.say-q.s{font-size:20px}

.samples{display:flex;flex-direction:column;gap:6px;margin-top:12px}

.bub.me{background:var(--sub);margin-left:auto}
.bub.ag{border:1px solid var(--line)}
.bub b{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-bottom:2px}

.sn{font:11px var(--mono);color:var(--mute);width:16px;flex:none}
.st{flex:1}
.srow input{flex:1}
.note{font-size:12px;color:var(--mute);margin-top:12px}

.lh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.tks{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

.shot figcaption{font-size:12px;color:var(--mute);margin-top:6px}

</style>

function tick(){const R=S.run;R.tick++;if(R.fault){log('故障未清，不派活');return}

else if(I.step===1){b=`<div class='bub me'>${esc(I.raw)}</div><div class='bub ag'><b>网页 agent</b>我复述一遍：街坊在手机上挑一个取货时间，你按单备货。再问五件容易漏的小事，每件我先填了默认值，不对就改。</div>`+EDGE.map((e,i)=>`<label class='erow'><span class='el'>${e[0]}</span><span>${e[1]}</span><input id='e${i}' value='${esc(I.edge[i])}'></label>`).join('')+`<div class='bar'><span class='mute sm'>${T('推断')} 一个时段放几单，不问就会拖到拆票时才冒出来。</span><button class='btn primary' data-act='edge'>就这些</button></div>`}

else{const L=[['做什么','街坊在手机上选一个取货时段，你早上看到备货清单。'],['给谁用','附近街坊，不用登录。'],['怎么找到你','门口二维码，扫了在微信里打开。'],['怎么付钱','不做在线支付，到店付。'],['什么算成',I.scen.length+' 条，写在下面。']];

return head('C','设计与拆票','主机 agent 写 spec 和票。你在同一屏看接缝、票单、每票验收，点一下才开工。','Mac 上的 agent，你点第 2 次','约 2 分钟')+`<div class='card'><div class='ch'><b>spec 放在哪</b>${T('待定')}</div><p>spec 是 GitHub issue #128，贴「spec」标签，不打 ready-for-agent。调度器按标签认票，就不会把它当票。</p><p class='mute sm'>上游 to-spec 本来就发成 issue。v2 写成仓库文件，两处并存会让调度器认错。我建议以 issue 为准。</p></div>`+`<div class='card'><div class='ch'><b>接缝</b>${T('有出处')}<span class='mute sm' style='margin-left:auto'>${ok} / 3 认可</span></div><p class='mute sm'>接缝是测试能替换、能观察的那一层。上游 to-spec 要人确认，v2 丢了，这里补回来。</p>`+SEAM.map((s,i)=>`<div class='ck'><span class='dot ${P.s[i]?'d':''}'>${P.s[i]?'✓':''}</span><span><b>${s[0]}</b> ${s[1]}</span><button class='btn sm own' data-act='seam' data-i='${i}'>${P.s[i]?'已认可':'认可'}</button></div>`).join('')+`</div>`+`<div class='card'><div class='ch'><b>票单</b>${T('已定')}<span class='mute sm' style='margin-left:auto'>垂直切片，每张能单独演示</span></div>`+TK.map((t,i)=>`<div class='tkrow'><div class='tkh'><span class='el'>${t[0]}</span><b>${t[1]}</b>${t[2].length?`<span class='pill'>等 ${t[2].join('、')}</span>`:`<span class='pill'>可先跑</span>`}${P.e[i]?`<span class='pill'>你改过</span>`:''}<button class='lk' data-act='tkedit' data-i='${i}'>改验收</button></div><div class='mute sm'>验收：${t[3]}</div></div>`).join('')+`</div><div class='bar'><span class='mute sm'>前五单保留这一下，数你改了几次，再定长期留不留。这是第 1 单，你改了 ${P.n} 次。</span><button class='btn primary' data-act='sok'>按这个拆</button></div>`+(P.ok?`<div class='card'><div class='ch'><b>开工</b></div><p class='mute sm'>调度器下一轮对账读到 5 张票已点头，每个客户只派一张。</p><div class='bar'><span class='mute'></span><button class='btn primary' data-act='go' data-s='run'>看执行</button></div></div>`:'')}

edge:()=>{EDGE.forEach((e,i)=>{const el=$('#e'+i);if(el)S.in.edge[i]=el.value});S.in.step=2;render()},
ed:d=>{S.in.ed=+d.i;render()},
edsave:d=>{const el=$('#edin');if(el&&el.value.trim())S.in.scen[+d.i].t=el.value.trim();S.in.ed=null;render()},
del:d=>{S.in.scen.splice(+d.i,1);S.in.ed=null;render()},
scen:()=>{if(!S.in.scen.length){toast('至少留一条');return}S.in.step=3;render()},
back:d=>{S.in.step=+d.s;render()},
confirm:()=>{S.in.step=4;S.in.acts=0;render();const next=()=>{if(S.in.step===4&&S.in.acts<4){S.in.acts++;if(S.screen==='intake')render();setTimeout(next,500)}};setTimeout(next,300)},
rp:()=>{clearInterval(tRp);S.rp.n=0;tRp=setInterval(()=>{S.rp.n++;if(S.rp.n>=RT){clearInterval(tRp);tRp=null}render()},130);render()},
gp:d=>{S.gt.p[d.g]=+d.o;render()},
gall:()=>{GATES.forEach(g=>{S.gt.p[g[2]]=0});render()},
gsmall:()=>{S.gt.small=!S.gt.small;render()},
gok:()=>{S.gt.ok=true;render()},
seam:d=>{S.sp.s[+d.i]=!S.sp.s[+d.i];render()},
tkedit:d=>{S.sp.e[+d.i]=true;S.sp.n++;render()},
sok:()=>{S.sp.ok=true;render()},
tick:()=>{tick();render()},
auto:()=>{if(S.run.auto){clearInterval(tRun);tRun=null;S.run.auto=false}else{S.run.auto=true;tRun=setInterval(()=>{tick();render()},1400)}render()},
fault:()=>{const R=S.run;if(R.fault){R.fault=false;log('你换了令牌，从停下的那一步接着跑')}else{R.fault=true;log('token 报 403，重试没用，不计圈数，停整条线，推你')}render()},
rej:d=>{const i=+d.i,l=LN[i],s=S.run.lanes[i];s.rd++;s.st=1;log(l[0]+' '+tid(l,s)+' 评审打回，第 '+s.rd+' 圈');if(s.rd>=3){s.stat='stopped';s.why='三圈没进展';log(l[0]+' 停这张票，推你：现象、试过什么、建议怎么办')}render()},
retry:d=>{const s=S.run.lanes[+d.i];s.stat='run';s.rd=0;s.st=0;log(LN[+d.i][0]+' 你说再试一次，这张票重新开始');render()},
asm:d=>{S.ac.a[+d.i]=!S.ac.a[+d.i];render()},
pass:()=>{S.ac.res='pass';render()},
acrej:()=>{S.ac.res='rej';render()},
mstep:d=>{S.mp.i=+d.i;render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=H[el.dataset.act];if(f)f(el.dataset)});
render();
})();
</script>
</body>
</html>
