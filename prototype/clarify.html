<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="澄清层的题卡、重讲和原型隔离小窗演示">
<link rel="icon" href="data:,">
<title>澄清层 · 说清楚再开工</title>
<style>
:root{--paper:#f1f3f1;--ink:#202521;--muted:#5e6862;--line:#d3d9d4;--card:#fff;--accent:#c94f35;--accent-soft:#f5e2db;--green:#32684d;--blue:#315e73;--shadow:0 8px 24px rgba(32,37,33,.06);--serif:Georgia,'Songti SC',serif;--sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:22px 22px 52px}.top{display:flex;align-items:center;gap:12px;margin-bottom:34px}.mark{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:700 15px var(--serif)}.eyebrow{font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:0;color:var(--muted)}.top .spacer{flex:1}.mode{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:6px 10px;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:16px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}.question{padding:22px}.cardhead{display:flex;justify-content:space-between;gap:16px;align-items:start}.round{color:var(--accent);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.question h2{font:600 26px/1.2 var(--serif);margin:8px 0 6px}.question .body{color:var(--muted);margin:0 0 16px}.recommend{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12px;margin-bottom:10px}.recommend:before{content:'↗';font-size:15px}.diagram{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}.diagram div{border:1px solid var(--line);border-radius:4px;padding:9px 10px;background:#f5f7f4;font-size:12px}.diagram b{display:block;margin-bottom:3px;color:var(--blue)}.options{display:grid;gap:8px}.opt{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:11px 12px;color:var(--ink);transition:background .18s,border-color .18s}.opt:hover{border-color:var(--accent);background:#fffaf7}.opt.selected{border-color:var(--ink);background:var(--ink);color:var(--paper)}.opt small{font-size:11px;opacity:.72}.free{display:flex;gap:8px;margin-top:12px}.free input{min-width:0;flex:1;border:1px solid var(--line);background:transparent;border-radius:6px;padding:9px 11px}.send,.primary{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:9px 12px}.questionfoot{display:flex;align-items:center;gap:14px;margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.questionfoot .spacer{flex:1}.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:13px}.who{font-size:12px;color:var(--muted);padding:3px 7px;border:1px solid var(--line);border-radius:4px;white-space:nowrap}.explain{margin-top:14px;border-left:3px solid var(--accent);padding:12px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}.explain b{font-size:12px}.explain p{margin:4px 0 10px}.explain .actions{display:flex;gap:12px;align-items:center}.facts{margin-top:13px;padding:12px 14px;border:1px dashed var(--blue);border-radius:6px;color:var(--blue);background:#edf3f4;font-size:13px}.preview{padding:16px}.preview h3{font:600 20px var(--serif);margin:0 0 3px}.preview p{margin:0;color:var(--muted);font-size:13px}.previewbar{display:flex;align-items:center;gap:8px;margin:14px 0 10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.previewbar .spacer{flex:1}.tag{font-size:11px;border-radius:4px;border:1px solid var(--line);padding:2px 7px;color:var(--muted)}.framewrap{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#f6f7f5;min-height:240px}.framewrap.empty{display:grid;place-items:center;padding:30px;color:var(--muted);text-align:center}.framewrap iframe{display:block;width:100%;height:300px;border:0}.security{margin-top:11px;font-size:12px;color:var(--muted);display:flex;gap:8px;line-height:1.5}.shield{color:var(--green);font-size:16px}.state{margin-top:16px;padding:15px 17px}.statehead{display:flex;justify-content:space-between;align-items:center}.state h3{font:600 18px var(--serif);margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.step{border-top:2px solid var(--line);padding-top:7px;color:var(--muted);font-size:12px}.step.on{border-color:var(--accent);color:var(--ink)}.step.done{border-color:var(--green);color:var(--green)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:6px;padding:8px 13px;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:780px){.shell{padding:17px 13px 38px}.top{margin-bottom:26px}.grid{grid-template-columns:1fr}.question{padding:17px}.steps{grid-template-columns:repeat(3,1fr);row-gap:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.success{color:var(--green);font-size:13px;margin:8px 0}
</style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="mark" aria-hidden="true">澄</div><div><div class="eyebrow">需求澄清 · 第 1 轮</div><strong>说清楚，再开工</strong></div><div class="spacer"></div><button class="mode" id="reset">重置演示</button></header>
  <section class="grid">
    <article class="card question" id="question"></article>
    <aside class="card preview" id="preview"></aside>
  </section>
  <section class="card state" id="state"></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const answer = { selected: null, custom: '', explain: false, understood: false, prototype: false };
  const data = { schema_version:'clarify.v0', round:1, segment:'business', questions:[{id:'Q1',title:'这个页面主要给谁用？',body:'先按最常见的人来算。你可以改成自己的说法。',options:['顾客','员工','自己'],recommended:0,who:'customer',diagram:{type:'comparison',left:{label:'现在',items:['聊天里问']},right:{label:'以后',items:['打开页面就能看']}}}],facts_pending:[{id:'F1',claim:'同类店铺通常怎样接预约？',status:'checking',display:'这题我在查。你可以先答不依赖它的题。'}],frontier_empty:false,summary:null};
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const question = document.querySelector('#question');
  const preview = document.querySelector('#preview');
  const toast = message => { const el=document.querySelector('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),1800); };
  const frame = () => `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"><style>body{margin:0;background:#fff;color:#202521;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;padding:16px}h2{font:600 21px Georgia,'Songti SC',serif;margin:0 0 4px}p{color:#5e6862;margin:0 0 12px;font-size:13px}.choice,button{display:block;width:100%;text-align:left;border:1px solid #d3d9d4;border-radius:6px;padding:10px 11px;background:#fff;margin-top:8px;color:#202521;font:inherit}.choice.selected{border-color:#32684d;background:#eef4ef}.choice b{display:block;margin-bottom:2px}.choice span{color:#5e6862;font-size:12px}.confirm{border:0;background:#c94f35;color:white;text-align:center}#result{min-height:21px;margin-top:10px}</style></head><body><h2>预约取货</h2><p>选一个方便的时间。</p><button class="choice" data-slot="明天上午"><b>明天上午</b><span>还剩 3 个位置</span></button><button class="choice" data-slot="明天下午"><b>明天下午</b><span>还剩 5 个位置</span></button><button class="confirm" id="confirm">确认预约</button><p id="result" aria-live="polite">请选择取货时间。</p><script>let selected='';document.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.slot;document.querySelectorAll('[data-slot]').forEach(x=>x.classList.toggle('selected',x===b));document.querySelector('#result').textContent='已选'+selected+'。';}));document.querySelector('#confirm').addEventListener('click',()=>{document.querySelector('#result').textContent=selected?'已预约'+selected+'。':'请先选一个时间。';});<\/script></body></html>`;
  const renderPreview = () => {
    preview.innerHTML = `<h3>页面预览</h3><div class="previewbar"><span class="dot"></span><span class="tag">${answer.prototype?'正在预览':'尚未生成'}</span></div>${answer.prototype?`<div class="framewrap"><iframe sandbox="allow-scripts" title="预约取货页面" srcdoc="${esc(frame())}"></iframe></div>`:`<div class="framewrap empty"><strong>尚无页面预览</strong></div>`}`;
  };
  const renderQuestion = () => {
    const q=data.questions[0];
    const diagram = q.diagram?.type==='comparison' ? `<div class="diagram" aria-label="场景对照">${[q.diagram.left,q.diagram.right].map(col=>`<div><b>${esc(col.label)}</b>${col.items.map(item=>`<span>${esc(item)}</span>`).join('<br>')}</div>`).join('')}</div>` : '';
    const explain = answer.explain ? `<div class="explain"><b>换个说法</b><p>这题是在问：谁会打开这个页面。现在先按顾客来想，因为顾客要看时间和位置。比如街坊想订明天上午的砂糖橘，他打开后直接选时间，不用先翻聊天记录。</p>${answer.understood?'<p class="success">已记下，这题你看懂了。</p>':''}<div class="actions"><button class="link" id="clear">${answer.understood?'已看懂':'清楚了'}</button><button class="primary" id="still">还是不懂，给我看一页</button></div></div>` : `<div class="questionfoot"><button class="link" id="explain">看不懂？换个说法</button><span class="spacer"></span><span class="eyebrow">Q1</span></div>`;
    question.innerHTML = `<div class="cardhead"><div><div class="round">第 ${data.round} 轮 · 生意</div><h2>${esc(q.title)}</h2><p class="body">${esc(q.body)}</p></div><span class="who">你来回答</span></div><div class="recommend">推荐先按“${esc(q.options[q.recommended])}”算，点了也能改</div>${diagram}<div class="options">${q.options.map((o,i)=>`<button class="opt ${answer.selected===i?'selected':''}" data-option="${i}"><span>${esc(o)}</span>${i===q.recommended?'<small>推荐</small>':''}</button>`).join('')}</div><div class="free"><input id="free" aria-label="自己说" placeholder="或者你自己说"><button class="send" id="free-send">写入</button></div>${answer.selected==='custom'?`<p class="body">你说：${esc(answer.custom)}</p>`:''}${explain}<div class="facts"><strong>正在查一件事</strong><br>${esc(data.facts_pending[0].claim)}</div>`;
    question.querySelectorAll('[data-option]').forEach(el=>el.addEventListener('click',()=>{answer.selected=Number(el.dataset.option);toast('已记下这一题');renderQuestion();renderState();}));
    question.querySelector('#explain')?.addEventListener('click',()=>{answer.explain=true;renderQuestion();renderPreview();renderState();});
    question.querySelector('#clear')?.addEventListener('click',()=>{answer.understood=true;renderQuestion();renderState();toast('已记下');});
    question.querySelector('#still')?.addEventListener('click',()=>{answer.prototype=true;renderQuestion();renderPreview();renderState();toast('已生成一页');});
    question.querySelector('#free-send').addEventListener('click',()=>{const input=question.querySelector('#free');if(input.value.trim()){answer.selected='custom';answer.custom=input.value.trim();toast('已记下');renderQuestion();renderState();}else toast('先写一句自己的话');});
  };
  const renderState = () => { document.querySelector('#state').innerHTML=`<div class="statehead"><h3>进度</h3><span class="eyebrow">${answer.prototype?'原型预览':answer.explain?'换个说法':'第 '+data.round+' 轮'}</span></div><div class="steps"><div class="step ${answer.explain?'done':'on'}">01 看题</div><div class="step ${answer.prototype?'done':answer.explain?'on':''}">02 重讲</div><div class="step ${answer.prototype?'on':''}">03 看页面</div></div>`;};
  document.querySelector('#reset').addEventListener('click',()=>{answer.selected=null;answer.custom='';answer.explain=false;answer.understood=false;answer.prototype=false;renderQuestion();renderPreview();renderState();toast('已重置');});
  renderQuestion();renderPreview();renderState();
})();
</script>
</body>
</html>
