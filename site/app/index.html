<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      document.documentElement.classList.add('js-motion')
      setTimeout(function () {
        if (!window.__afkMotionReady) document.documentElement.classList.remove('js-motion')
      }, 2500)
    </script>
    <meta name="theme-color" content="#f0eee6" />
    <script>
      ;(function () {
        var stored = null
        try {
          stored = window.localStorage.getItem('afk-theme')
        } catch (error) {}
        var dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#141413')
        }
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex" />
    <title>账号区 · afkfactory</title>
    <meta
      name="description"
      content="登录后上传工作区，查看订单进度。"
    />
  </head>
  <body>
    <div id="root" data-page="app"><!--app-html--></div>
    <noscript>
      <p style="margin: 0; padding: 24px 64px; font-family: sans-serif">
        账号区需要开启 JavaScript。
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
