<!doctype html>
<html lang="zh-CN" data-en-title="afkfactory · Requirement Clarification" data-en-description="Download the client workspace, set it up in three steps, explain what you need, and send it back when you are done.">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      document.documentElement.classList.add('js-motion')
      setTimeout(function () {
        if (!window.__afkMotionReady) document.documentElement.classList.remove('js-motion')
      }, 2500)
    </script>
    <meta name="theme-color" content="#f0eee6" />
    <script>
      ;(function () {
        var stored = null
        try {
          stored = window.localStorage.getItem('afk-theme')
        } catch (error) {}
        var dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#141413')
        }
      })()
    </script>
    <script>
      ;(function () {
        var lang = null
        try {
          lang = window.localStorage.getItem('afk-lang')
        } catch (error) {}
        if (lang === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.setAttribute('data-lang', 'en')
          document.documentElement.classList.add('lang-pending')
          ;[
            ['/fonts/SourceSerif4-Variable.woff2', 'font'],
            ['/fonts/InstrumentSans-Variable.woff2', 'font'],
          ].forEach(function (entry) {
            var link = document.createElement('link')
            link.rel = 'preload'
            link.as = entry[1]
            link.type = 'font/woff2'
            link.crossOrigin = 'anonymous'
            link.href = entry[0]
            document.head.appendChild(link)
          })
          setTimeout(function () {
            document.documentElement.classList.remove('lang-pending')
          }, 2500)
        }
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>afkfactory · 需求澄清</title>
    <meta
      name="description"
      content="下载客户工作区，按三步装好，把需求说清楚，做完传回来。"
    />
    <script>
      ;(function () {
        if (document.documentElement.getAttribute('data-lang') !== 'en') return
        var root = document.documentElement
        var title = root.getAttribute('data-en-title')
        if (title) document.title = title
        var description = root.getAttribute('data-en-description')
        var meta = document.querySelector('meta[name="description"]')
        if (description && meta) meta.setAttribute('content', description)
      })()
    </script>
  </head>
  <body>
    <div id="root" data-page="home"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
