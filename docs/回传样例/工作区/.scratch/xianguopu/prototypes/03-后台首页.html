<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>后台首页样例</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 24px; }
li { margin: 12px 0; }
.sold { color: #888; text-decoration: line-through; }
</style>
</head>
<body>
<h1>今天的水果</h1>
<ul>
<li>苹果 8 元/斤 —— 剩 12 斤</li>
<li class="sold">香蕉 5 元/斤 —— 卖完了</li>
<li>橙子 6 元/斤 —— 剩 20 斤</li>
</ul>
<p>点一下价格就能改。这是样例原型，不是可用页面。</p>
</body>
</html>
